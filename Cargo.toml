[package]
name = "flyaway"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Fly Away, Fly! A small endless flyer about a hungry crow."
publish = false

[dependencies]
# Sprites, UI, text, audio, picking and the windowing backends, without the
# 3D renderer we'd never use.
bevy = { version = "0.20.0", default-features = false, features = ["2d", "ui", "audio"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Browser builds render through WebGPU instead of WebGL2, keep saves in
# localStorage, and need a JS-backed random seed.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d", "ui", "audio", "webgpu"] }
fastrand = { version = "2", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Debug builds of Bevy itself are painfully slow, so optimise dependencies even
# in dev while keeping our own crate quick to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Used by web/build.sh. Smaller is better when it has to come down the wire.
# (Fat LTO would shave a little more off, but needs a lot of RAM to link.)
[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
